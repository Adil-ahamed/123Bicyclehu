<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bicycle Hub | Premium Bicycles & Accessories</title>
    <meta
      name="description"
      content="Bicycle Hub offers premium bicycles, accessories, and repair services. Find mountain bikes, road bikes, and more at the best prices."
    />
    <meta
      name="keywords"
      content="Bicycles, Mountain Bikes, Road Bikes, Bicycle Accessories, Cycle Shop"
    />
    <meta name="author" content="Bicycle Hub" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta
      property="og:title"
      content="Bicycle Hub | Premium Bicycles & Accessories"
    />
    <meta
      property="og:description"
      content="Discover high-quality bicycles and accessories at Bicycle Hub. Shop mountain bikes, road bikes, and more."
    />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:url" content="https://www.bicyclehub.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bicycle Hub | Premium Bicycles & Accessories"
    />
    <meta
      name="twitter:description"
      content="Shop the best bicycles and accessories at Bicycle Hub."
    />
    <meta name="twitter:image" content="/images/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" href="/images/logo.png" type="image/x-icon" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.bicyclehub.com/" />

    <!-- Schema.org JSON-LD (Structured Data for Google Rich Results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsStore",
        "name": "Bicycle Hub",
        "url": "https://www.bicyclehub.com",
        "logo": "https://www.bicyclehub.com/logo.png",
        "sameAs": [
          "https://www.facebook.com/bicyclehub",
          "https://twitter.com/bicyclehub",
          "https://www.instagram.com/bicyclehub"
        ],
        "description": "Bicycle Hub offers premium bicycles, accessories, and repair services. Shop mountain bikes, road bikes, and more.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123 Cycle Street",
          "addressLocality": "Calicut",
          "addressRegion": "Kerala",
          "postalCode": "673001",
          "addressCountry": "IN"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
